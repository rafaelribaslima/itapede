<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block titulo %}ItaPede{% endblock %}</title>
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.1.18"></script>
</head>
<body class="bg-gray-100 text-gray-800 min-h-screen flex flex-col">
  <header class="bg-orange-600 text-white">
    <div class="max-w-5xl mx-auto px-4 py-4 flex items-center justify-between">
      <a href="{{ url_for('inicio') }}" class="text-2xl font-bold">ItaPede</a>
      <div class="text-right text-sm">
        <div>Ambiente de teste · Itapeva e região</div>
        <div class="opacity-80">versão {{ versao }}</div>
      </div>
    </div>
  </header>
  <main class="max-w-5xl w-full mx-auto px-4 py-6 flex-1">
    {% with msgs = get_flashed_messages(with_categories=true) %}
      {% for cat, msg in msgs %}
        <div class="mb-4 rounded-lg px-4 py-3 text-sm {{ 'bg-red-100 text-red-700' if cat == 'erro' else 'bg-green-100 text-green-800' }}">{{ msg }}</div>
      {% endfor %}
    {% endwith %}
    {% block conteudo %}{% endblock %}
  </main>
  <footer class="text-center text-xs text-gray-500 py-4">ItaPede {{ versao }} · dados fictícios para testes</footer>
</body>
</html>
